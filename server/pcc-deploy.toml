agent_name = "prm-voice-bot"
secret_set = "prm-voice-secrets"
agent_profile = "agent-1x"

[scaling]
	# Keep one agent warm so the live demo connects instantly (spec §9).
	min_agents = 1

[krisp_viva]
	# Provisions the Krisp VIVA noise-cancellation model so the
	# KrispVivaFilter() bot.py wires onto audio_in (when ENV != "local") has a
	# model to run. "pro" = WebRTC (up to 32 kHz), which matches our Daily/WebRTC
	# browser transport. Use "tel" instead only if routing through telephony.
	audio_filter = "pro"

[build]
	# Pipecat cloud build: `pcc deploy` (no image arg) uploads this context and
	# builds the arm64 image in the cloud — no Docker Hub / registry account.
	context_dir = "."
	dockerfile = "Dockerfile"

[build.exclude]
	# Trim the uploaded build context: keep secrets OUT (.env*), and drop heavy
	# or irrelevant local artifacts. The Dockerfile only COPYs *.py + prm/, but
	# excludes still matter because the whole context is uploaded to the builder.
	patterns = [
		".venv/",
		"**/__pycache__/",
		".ruff_cache/",
		".env",
		".env.*",
		"*.md",
	]
